app = "lorana-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  TZ = "America/Sao_Paulo"

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
